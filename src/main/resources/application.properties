spring.application.name=VoucherMangementSystem
server.port=8080

# Optional local secret file (kept out of git)
spring.config.import=optional:file:./config/application-secrets.properties,optional:classpath:application-secrets.properties

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/new_voucher_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

#JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate

#show the sql query in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# this will tell hibernate how mysql behaves
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=voucher-management-system
security.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:6000}
security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
security.roles.platform-admin=PLATFORM_ADMIN
security.roles.tenant-admin=TENANT_ADMIN
security.roles.user=USER

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

# Swagger UI deterministic ordering
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Reporting
report.storage.path=${REPORT_STORAGE_PATH:./generated-reports}
report.email.from=${REPORT_EMAIL_FROM:no-reply@voucher.local}

# Mail fail-fast timeouts (milliseconds) to avoid long IN_PROGRESS hangs
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

# Report async step hard timeouts (milliseconds)
report.job.pdf-timeout-ms=${REPORT_PDF_TIMEOUT_MS:30000}
report.job.email-timeout-ms=${REPORT_EMAIL_TIMEOUT_MS:30000}


# expose actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# enable prometheus endpoint
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# metrics tags
management.metrics.tags.application=${spring.application.name}


# write all the log inside this file
logging.file.path=/app/logs
logging.level.root=INFO
