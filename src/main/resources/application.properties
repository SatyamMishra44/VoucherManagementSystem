spring.application.name=VoucherMangementSystem
server.port=8080

# Optional local secret file (kept out of git)
spring.config.import=optional:file:./config/application-secrets.properties,optional:classpath:application-secrets.properties

# Database connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA / Hibernate Configuration
# hibernate creates/update tables automatically
spring.jpa.hibernate.ddl-auto=update

#show the sql query in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# this will tell hibernate how mysql behaves
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=voucher-management-system
security.jwt.expiration-seconds=86400
security.roles.admin=ADMIN
security.roles.user=USER

# Swagger UI deterministic ordering
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
