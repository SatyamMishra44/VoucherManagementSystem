spring.application.name=VoucherMangementSystem
server.port=8080

# Optional local secret file (kept out of git)
spring.config.import=optional:file:./config/application-secrets.properties,optional:classpath:application-secrets.properties

# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/new_voucher_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

#JPA / Hibernate Configuration
# hibernate creates/update tables automatically
spring.jpa.hibernate.ddl-auto=update

#show the sql query in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# this will tell hibernate how mysql behaves
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=voucher-management-system
security.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:600}
security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
security.roles.admin=ADMIN
security.roles.user=USER

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

# Swagger UI deterministic ordering
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
