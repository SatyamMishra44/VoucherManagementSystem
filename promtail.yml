server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-logs
    pipeline_stages:
      - json:
          expressions:
            tenantId: tenantId
      - labels:
          tenantId:
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          service: VoucherMangementSystem
          instance: ${HOSTNAME}
          app: VoucherMangementSystem
          __path__: /app/logs/*.log
